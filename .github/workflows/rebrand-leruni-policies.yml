name: Rebrand LERUNI Policies

on:
  push:
    branches:
      - rebrand/leruni-v1.6.0

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebrand/leruni-v1.6.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Rebrand policy pages
        run: python rebrand_leruni_policies.py
      - name: Remove one-shot files
        run: |
          rm -f rebrand_leruni_policies.py
          rm -f .github/workflows/rebrand-leruni-policies.yml
      - name: Commit policy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Rebrand public policy pages to LERUNI"
          git push origin HEAD:rebrand/leruni-v1.6.0
